<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Anggota - SIMPUS-Mini</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- SIDEBAR -->
         <sidebar>
            <div class="sidebar-header">
                <h1>SIMPUS-Mini</h1>
                <!-- Tombol Hamburger khusus tampilan mobile -->
                <button id="nav-toggle-btn" class="nav-toggle-btn" type="button">&#9776;</button>
            </div>
            <nav id="sidebar-nav">
                <ul>
                    <li><a href="../index.html">Beranda</a></li>
                    <li><a href="../buku/list1.html">Daftar Buku</a></li>
                    <li><a href="../buku/tambah1.html">Tambah Buku</a></li>
                    <li><a href="../anggota/list.html">Daftar Anggota</a></li>
                    <li><a href="../anggota/tambah.html">Daftar Anggota</a></li>
                </ul>
            </nav>
        </sidebar>

        <!-- KONTEN UTAMA -->
        <div class="main-wrapper">
            <main>
                <section>
                    <h2>Tambah Anggota</h2>
                    <form id="form-tambah" novalidate>
                        <p>
                            <label for="no_anggota">No. Anggota</label>
                            <input type="text" id="no_anggota" name="no_anggota" required>
                        </p>
                        <p>
                            <label for="nama">Nama</label>
                            <input type="text" id="nama" name="nama" required>
                        </p>
                        <p>
                            <label for="alamat">Alamat</label>
                            <input type="text" id="alamat" name="alamat" required>
                        </p>
                        <p>
                            <label for="no_hp">No. HP</label>
                            <input type="text" id="no_hp" name="no_hp" required>
                        </p>
                        <p>
                            <button type="submit">Simpan</button>
                        </p>
                    </form>
                </section>
            </main>

            <footer>
                <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 6</p>
            </footer>
        </div>
    </div>

    <script src="../assets/js/app.js"></script>
</body>
</html>
