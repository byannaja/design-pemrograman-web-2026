<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Buku - SIMPUS-Mini</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- SIDEBAR -->
        <sidebar>
            <div class="sidebar-header">
                <h1>SIMPUS-Mini</h1>
                <!-- Tombol Hamburger khusus tampilan mobile -->
                <button id="nav-toggle-btn" class="nav-toggle-btn" type="button">&#9776;</button>
            </div>
            <nav id="sidebar-nav">
                <ul>
                    <li><a href="../index.html">Beranda</a></li>
                    <li><a href="../buku/list1.html">Daftar Buku</a></li>
                    <li><a href="../buku/tambah1.html">Tambah Buku</a></li>
                    <li><a href="../anggota/list.html">Daftar Anggota</a></li>
                    <li><a href="../anggota/tambah.html">Daftar Anggota</a></li>
                </ul>
            </nav>
        </sidebar>

        <!-- KONTEN UTAMA -->
        <div class="main-wrapper">
            <main>
                <section>
                    <h2>Tambah Buku</h2>
                    <form id="form-tambah" novalidate>
                        <p>
                            <label for="no">No.</label>
                            <input type="number" id="no" name="no" required>
                        </p>
                        <p>
                            <label for="judul">Judul</label>
                            <input type="text" id="judul" name="judul" required>
                        </p>
                        <p>
                            <label for="pengarang">Pengarang</label>
                            <input type="text" id="pengarang" name="pengarang" required>
                        </p>
                        <p>
                            <label for="tahun">Tahun</label>
                            <input type="number" id="tahun" name="tahun" required>
                        </p>
                        <p>
                            <label for="stok">Stok</label>
                            <input type="number" id="stok" name="stok" required>
                        </p>
                        <p>
                            <label for="kategori">Kategori</label>
                            <input type="text" id="kategori" name="kategori" required>
                        </p>
                        <p>
                            <button type="submit">Simpan</button>
                        </p>
                    </form>
                </section>
            </main>

            <footer>
                <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 6</p>
            </footer>
        </div>
    </div>

    <script src="../assets/js/app.js"></script>
</body>
</html>
